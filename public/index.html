<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liar’s Poker</title>
<style>
:root{--gold:#e8c46a;--paper:#fbf8ef;--red:#c62828;--ink:#14201a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#052a1c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;color:#f4efdf;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(ellipse at 50% 0%,#14895f 0%,#0b5d3b 45%,#052a1c 100%) fixed}
#app{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.logo{font:700 30px Georgia,"Times New Roman",serif;color:var(--gold);text-align:center;margin:6px 0 16px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.logo small{display:block;font-size:15px;letter-spacing:.5em;margin-top:2px}.logo .r{color:#ff6b5e}
.glass{background:rgba(0,0,0,.27);border:1px solid rgba(232,196,106,.28);border-radius:20px;padding:16px;margin-bottom:14px;backdrop-filter:blur(6px)}
.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:12px 0 6px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:#fff;font:inherit}
input::placeholder{color:rgba(255,255,255,.4)}
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink);background:linear-gradient(#f3d98c,#d3a84a);box-shadow:0 3px 0 #8a6420,0 6px 12px rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6420}
.btn.red{background:linear-gradient(#ef6b5b,#c62828);color:#fff;box-shadow:0 3px 0 #7d1414,0 6px 12px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(255,255,255,.1);color:#f4efdf;box-shadow:none;border:1px solid rgba(255,255,255,.22)}
.wide{width:100%;margin-top:10px}
.row{display:flex;gap:10px;margin-top:14px}.row .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#f4efdf;padding:8px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.chip.rd{color:#ff8a7a}.chip.on.rd{color:var(--red)}
.seats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.seat{width:104px;padding:10px 6px;text-align:center;border-radius:16px;background:rgba(0,0,0,.28);border:2px solid transparent}
.seat.turn{border-color:var(--gold);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 18px 2px rgba(232,196,106,.7)}}
.seat.dead{opacity:.4;filter:grayscale(1)}
.av{width:44px;height:44px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;border:2px solid rgba(255,255,255,.5)}
.sn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:rgba(255,255,255,.6);min-height:15px}
.pips{display:flex;justify-content:center;gap:2px;margin-top:5px;min-height:19px}
.pip{width:13px;height:19px;border-radius:3px;border:1px solid #fff;background:repeating-linear-gradient(45deg,#8b1d2c 0 3px,#a8283a 3px 6px)}
.felt{margin:14px 0;padding:22px 14px;text-align:center;border-radius:30px;border:3px solid rgba(232,196,106,.55);box-shadow:inset 0 0 40px rgba(0,0,0,.45);background:radial-gradient(ellipse,#0f7a52,#0a4d33)}
.felt .mu{color:rgba(255,255,255,.65);font-size:13px;margin-top:8px}
.plaque{display:inline-block;padding:12px 22px;border-radius:14px;background:linear-gradient(#f7e2a0,#d4a84b);color:#2a1d05;font:700 24px Georgia,serif;box-shadow:0 4px 14px rgba(0,0,0,.45);animation:pop .35s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card{position:relative;flex:none;width:62px;height:90px;border-radius:9px;background:var(--paper);color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.45);font-family:Georgia,serif}
.card.red{color:var(--red)}
.ct{position:absolute;top:4px;left:6px;display:flex;flex-direction:column;align-items:center;line-height:1;font-size:17px;font-weight:700}
.ct i{font-style:normal;font-size:14px}
.cm{position:absolute;inset:0;display:grid;place-items:center;font-size:36px;padding-top:12px}
.card.sm{width:42px;height:60px}.sm .ct{font-size:12px;top:3px;left:4px}.sm .ct i{font-size:10px}.sm .cm{font-size:22px;padding-top:8px}
.hand{display:flex;justify-content:center;padding:14px 0 4px}
.hand .card{margin-left:-12px}.hand .card:first-child{margin-left:0}
.anim{animation:deal .5s both}
@keyframes deal{from{transform:translateY(-60px) scale(.7) rotate(-12deg);opacity:0}}
.rv{display:flex;align-items:center;gap:10px;margin:10px 0}.rv b{width:90px;text-align:left;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.rv .card{margin-right:4px}
.verdict{font:800 32px Georgia,serif;letter-spacing:.08em;text-align:center}.t{color:#7dffb0}.f{color:#ff8a7a}
.tiles{display:flex;gap:8px;justify-content:center;margin:6px 0}
.tile{width:46px;height:58px;border-radius:10px;background:var(--paper);color:var(--ink);font:800 30px Georgia,serif;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.trophy{font-size:76px;text-align:center;animation:bounce .9s infinite alternate}
@keyframes bounce{to{transform:translateY(-10px) rotate(6deg)}}
.prev{margin-top:14px;text-align:center;font:700 20px Georgia,serif;color:var(--gold)}
.err{color:#ff8a7a;margin-top:10px;text-align:center}.mid{text-align:center}
details{margin-top:14px;color:rgba(255,255,255,.7);font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const B=(t,f,c)=>{const b=E('button','btn '+(c||''),t);b.onclick=f;return b};
const RL=r=>r<11?String(r):'JQKA'[r-11];
const rn=r=>r<11?String(r):['Jack','Queen','King','Ace'][r-11],pl=r=>rn(r)+'s';
const SY=['♥','♦','♣','♠'];
const CN={1:'High Card',2:'Pair',3:'Two Pair',4:'Three of a Kind',5:'Straight',6:'Flush',7:'Full House',8:'Four of a Kind',9:'Straight Flush',10:'Royal Flush'};
const SPEC={1:[['r',2,14]],2:[['r',2,14]],3:[['r',2,14],['r',2,14]],4:[['r',2,14]],5:[['r',6,14]],6:[['s'],['r',6,14]],7:[['r',2,14],['r',2,14]],8:[['r',2,14]],9:[['s'],['r',6,13]],10:[['s']]};
const LB={3:['Top pair','Lower pair'],5:['Highest card'],6:['Rank limit'],7:['Three of','Pair of'],9:['Highest card']};
function desc(b){const a=b.a,q=b.b,u=SY[b.s];switch(b.c){
case 1:return 'High card: '+rn(a);case 2:return 'Pair of '+pl(a);case 3:return 'Two pair: '+pl(a)+' & '+pl(q);
case 4:return 'Three '+pl(a);case 5:return 'Straight, '+rn(a)+' high';case 6:return 'Flush '+u+' up to '+rn(a);
case 7:return pl(a)+' full of '+pl(q);case 8:return 'Four '+pl(a);case 9:return 'Straight flush '+u+', '+rn(a)+' high';
default:return 'Royal flush '+u}}
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}};
let id=ls('lp_id');if(!id){id=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now());ls('lp_id',id)}
let name=ls('lp_name'),ws,s=null,err='',seen='',draft={c:1,a:14,b:13,s:0};
const code=()=>location.hash.slice(1).toUpperCase().replace(/[^A-Z0-9]/g,'');
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
const join=()=>{if(code()&&name)send({t:'join',room:code(),id,name})};
function conn(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=join;
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.t==='state'){s=m;err='';if(code()!==m.code)history.replaceState(null,'','#'+m.code)}else err=m.m;render()};
  ws.onclose=()=>setTimeout(conn,1500);
}
window.onhashchange=()=>{s=null;err='';join();render()};
const setName=v=>{name=(v||'').trim().slice(0,14);ls('lp_name',name);return name};
const leave=()=>{send({t:'leave'});s=null;history.replaceState(null,'','#');render()};

function face(c,cls,i,fresh){
  const e=E('div','card'+(c[1]<2?' red':'')+(cls?' '+cls:'')+(fresh?' anim':''));
  const t=E('div','ct');t.append(E('span',null,RL(c[0])),E('i',null,SY[c[1]]));e.append(t,E('div','cm',SY[c[1]]));
  if(fresh)e.style.animationDelay=(i*90)+'ms';return e}
function seat(i,lobby){
  const x=s.players[i],dead=x.cards>=6&&!lobby;
  const d=E('div','seat'+(!lobby&&s.phase==='bidding'&&s.turn===i?' turn':'')+(dead?' dead':''));
  const a=E('div','av',(x.name[0]||'?').toUpperCase());a.style.background='hsl('+hue(x.name)+' 55% 42%)';d.append(a);
  d.append(E('div','sn',x.name));
  d.append(E('div','sub',dead?'out ☠':i===s.me?'you':!x.online?'offline':lobby&&s.players[i]&&i===0?'host':(!lobby&&s.phase==='bidding'&&s.bidBy===i?'last bid':'')));
  const p=E('div','pips');if(!lobby&&!dead)for(let k=0;k<x.cards;k++)p.append(E('span','pip'));d.append(p);return d}

function render(){
  const app=$('#app');app.replaceChildren();
  const lg=E('div','logo','Liar’s Poker');const su=E('small');
  [['♠',''],['♥','r'],['♣',''],['♦','r']].forEach(([c,k])=>su.append(E('span',k,c)));lg.append(su);app.append(lg);
  if(!s)return home(app);
  s.phase==='lobby'?lobby(app):game(app);
}
function home(app){
  const p=E('div','glass');p.append(E('div','lab','Your name'));
  const ni=E('input');ni.value=name;ni.maxLength=14;ni.placeholder='What should we call you?';p.append(ni);
  const em=E('div','err');
  if(code()){
    p.append(E('div','lab','Joining room'));const t=E('div','tiles');[...code()].forEach(c=>t.append(E('div','tile',c)));p.append(t);
    p.append(B('Join room',()=>{if(!setName(ni.value))return em.textContent='Enter your name first.';join()},'wide'));
    p.append(B('Back',()=>{location.hash=''},'ghost wide'));
  }else{
    p.append(B('Create private room',()=>{if(!setName(ni.value))return em.textContent='Enter your name first.';send({t:'create',id,name})},'wide'));
    p.append(E('div','lab','Or join with a code'));
    const ci=E('input');ci.maxLength=5;ci.placeholder='ABCDE';ci.style.textTransform='uppercase';ci.style.letterSpacing='.3em';p.append(ci);
    p.append(B('Join room',()=>{if(!setName(ni.value))return em.textContent='Enter your name first.';if(!ci.value.trim())return em.textContent='Enter the room code.';location.hash=ci.value.trim().toUpperCase()},'ghost wide'));
  }
  em.textContent=err;p.append(em);app.append(p);
  const d=E('details');d.append(E('summary',null,'How to play'));
  d.append(E('p',null,'Everyone gets 2 cards. Bid on the best poker hand hiding in ALL the cards on the table, or call the previous bidder a liar. Lose a challenge and you take a card. Hit 6 cards and you’re out. Last player standing wins.'));app.append(d);
}
function lobby(app){
  const p=E('div','glass mid');p.append(E('div','lab','Room code'));
  const t=E('div','tiles');[...s.code].forEach(c=>t.append(E('div','tile',c)));p.append(t);
  const url=location.origin+'/#'+s.code,li=E('input');li.readOnly=true;li.value=url;li.style.marginTop='12px';li.onfocus=()=>li.select();p.append(li);
  const cb=B('Copy invite link',async()=>{try{await navigator.clipboard.writeText(url);cb.textContent='Copied ✓'}catch(e){li.select()}},'wide');p.append(cb);app.append(p);
  const q=E('div','glass');q.append(E('div','lab','Players · '+s.players.length+' / 8'));
  const g=E('div','seats');s.players.forEach((x,i)=>g.append(seat(i,true)));q.append(g);
  const row=E('div','row');
  if(s.isHost)row.append(B(s.players.length<2?'Waiting for players…':'Start game',()=>send({t:'start'})));
  else q.append(E('p','mid sub','Waiting for the host to start…'));
  row.append(B('Leave',leave,'ghost'));q.append(row);if(err)q.append(E('div','err',err));app.append(q);
}
function game(app){
  const m=s.me,al=i=>s.players[i].cards<6,key=s.round+s.phase,fresh=seen!==key;seen=key;
  const total=s.players.reduce((a,p)=>a+(p.cards<6?p.cards:0),0);
  const seats=E('div','seats');s.players.forEach((x,i)=>seats.append(seat(i)));app.append(seats);
  const felt=E('div','felt');
  if(s.phase==='over'){
    felt.append(E('div','trophy','🏆'),E('div','verdict t',s.players[s.winner].name+' wins!'));
    const row=E('div','row');if(s.isHost)row.append(B('Play again',()=>send({t:'again'})));row.append(B('Leave',leave,'ghost'));felt.append(row);app.append(felt);return}
  if(s.bid){felt.append(E('div','plaque',desc(s.bid)),E('div','mu','bid by '+s.players[s.bidBy].name))}
  else felt.append(E('div','plaque','Opening bid…'));
  felt.append(E('div','mu','Round '+s.round+' · '+total+' cards in play'));app.append(felt);
  if(s.phase==='reveal'){
    const r=s.result,p=E('div','glass'),out=s.players[r.loser].cards+1>=6;
    p.append(E('div','verdict '+(r.valid?'t':'f'),r.valid?'TRUE':'LIAR!'));
    p.append(E('p','mid',s.players[r.caller].name+' called. '+s.players[r.loser].name+(out?' loses and is eliminated!':' loses and takes a card.')));
    s.players.forEach((x,i)=>{if(!al(i)||!x.hand)return;const d=E('div','rv');d.append(E('b',null,x.name));const h=E('div','chips');x.hand.forEach((c,k)=>h.append(face(c,'sm',k,fresh)));d.append(h);p.append(d)});
    if(m>=0&&al(m))p.append(B('Next round',()=>send({t:'next'}),'wide'));else p.append(E('p','mid sub','Waiting for a player to continue…'));
    app.append(p);return;
  }
  if(m>=0&&al(m)){const hp=E('div','glass');hp.append(E('div','lab','Your hand'));const h=E('div','hand');
    s.hand.forEach((c,i)=>{const e=face(c,'',i,fresh);e.style.transform='rotate('+((i-(s.hand.length-1)/2)*6)+'deg)';h.append(e)});hp.append(h);app.append(hp)}
  else app.append(E('p','mid sub','You’re spectating.'));
  if(m<0||!al(m)||s.turn!==m){const w=E('div','glass mid');w.append(E('div','lab','Waiting for '+s.players[s.turn].name+'…'));app.append(w);return}
  controls(app);
}
function curBid(){const c=draft.c,b={c,a:0,b:0,s:0};let ri=0;
  SPEC[c].forEach(f=>{if(f[0]==='s')b.s=draft.s;else{const k=ri?'b':'a';draft[k]=Math.min(f[2],Math.max(f[1],draft[k]));b[k]=draft[k];ri++}});return b}
function controls(app){
  const p=E('div','glass'),royal=s.bid&&s.bid.c===10;p.append(E('div','lab','Your turn'));
  if(!royal){
    const cc=E('div','chips');Object.keys(CN).forEach(k=>{const c=E('button','chip'+(draft.c==k?' on':''),CN[k]);c.onclick=()=>{draft.c=+k;err='';render()};cc.append(c)});p.append(cc);
    const b=curBid();let ri=0;
    SPEC[b.c].forEach(f=>{
      if(f[0]==='s'){p.append(E('div','lab','Suit'));const r=E('div','chips');SY.forEach((u,i)=>{const c=E('button','chip'+(i<2?' rd':'')+(draft.s===i?' on':''),u);c.onclick=()=>{draft.s=i;render()};r.append(c)});p.append(r)}
      else{const k=ri?'b':'a';p.append(E('div','lab',(LB[b.c]||['Rank'])[ri]||'Rank'));const r=E('div','chips');
        for(let x=f[1];x<=f[2];x++){const c=E('button','chip'+(draft[k]===x?' on':''),RL(x));c.onclick=()=>{draft[k]=x;render()};r.append(c)}p.append(r);ri++}});
    p.append(E('div','prev',desc(b)));
  }
  const row=E('div','row');
  if(!royal)row.append(B('Raise',()=>{err='';send({t:'bid',bid:curBid()})}));
  if(s.bid)row.append(B('Call liar!',()=>send({t:'call'}),'red'));
  p.append(row);if(err)p.append(E('div','err',err));app.append(p);
}
render();conn();
</script>
</body>
</html>
